<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment confirmation • QuickMart Kenya</title><link rel="stylesheet" href="/theme.css"></head><body><header><a class="brand" href="/"><span class="mark">Q</span><span>QuickMart <b>Kenya</b><small>Payment confirmation</small></span></a></header><main><section class="portal"><div class="spinner">Verifying your Paystack payment…</div></section></main><script>const q=new URLSearchParams(location.search),r=q.get('reference');const ref=q.get('ref');if(r){fetch('/api/paystack/transaction?reference='+encodeURIComponent(r),{cache:'no-store'}).then(x=>x.json()).then(d=>{if(d.paid){location.replace('/portal/'+encodeURIComponent(ref||''));}else{document.querySelector('.portal').innerHTML='<div class="panel"><span class="eyebrow">PAYMENT UPDATE</span><h1>Payment not yet confirmed</h1><p>'+((d.message)||'Your payment is still being verified. Please use your application link to check again shortly.')+'</p><a class="btn dark" href="/portal/'+encodeURIComponent(ref||'')+'">Return to application</a></div>'}}).catch(()=>{document.querySelector('.portal').innerHTML='<div class="panel"><h1>Verification unavailable</h1><p>Please return to your application and try again.</p></div>'})}else{location.replace('/portal/'+encodeURIComponent(ref||''))}</script></body></html>
