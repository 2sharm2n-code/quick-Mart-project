<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quick Mart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; }
        .status-pending { color: orange; font-weight: bold; }
        .status-reviewed { color: blue; font-weight: bold; }
        .status-interview { color: #7c3aed; font-weight: bold; }
        .status-rejected { color: #dc2626; font-weight: bold; }
        .status-hired { color: green; font-weight: bold; }
        .status-select { padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; background: white; font: inherit; }
        .status-select:disabled { opacity: 0.6; cursor: wait; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Quick Mart Admin Dashboard</h1>
            <a href="index.html" class="back-link">← Back to Public Site</a>
        </div>
    </header>

    <main class="container">
        <h2>All Applications</h2>
        <div id="admin-content">
            <table id="applications-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Job ID</th>
                        <th>Candidate</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Resume</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be added here -->
                </tbody>
            </table>
            <p id="loading-msg">Loading applications...</p>
        </div>
    </main>

    <script>
        const API_URL = '/api';

        function statusClass(status) {
            return `status-${String(status || '').toLowerCase()}`;
        }

        async function updateApplicationStatus(id, select) {
            const previousStatus = select.dataset.previousStatus || select.value;
            const newStatus = select.value;
            select.disabled = true;

            try {
                const response = await fetch(`${API_URL}/applications/${encodeURIComponent(id)}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Failed to update status');

                select.dataset.previousStatus = result.status;
                select.className = `status-select ${statusClass(result.status)}`;
            } catch (error) {
                console.error(error);
                select.value = previousStatus;
                select.className = `status-select ${statusClass(previousStatus)}`;
                alert(`Could not update application status: ${error.message}`);
            } finally {
                select.disabled = false;
            }
        }

        async function loadApplications() {
            try {
                const response = await fetch(`${API_URL}/applications`);
                if (!response.ok) throw new Error('Failed to fetch applications');

                const apps = await response.json();
                const tbody = document.querySelector('#applications-table tbody');
                document.getElementById('loading-msg').style.display = 'none';

                if (apps.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No applications found.</td></tr>';
                    return;
                }

                apps.forEach(app => {
                    const row = document.createElement('tr');
                    const date = new Date(app.applied_date).toLocaleDateString();
                    const currentStatus = app.status || 'Pending';
                    const safeId = String(app.id).replace(/'/g, '&#39;');

                    row.innerHTML = `
                        <td>${date}</td>
                        <td>${app.job_id}</td>
                        <td>${app.full_name}</td>
                        <td>${app.email}</td>
                        <td>
                            <select class="status-select ${statusClass(currentStatus)}" data-previous-status="${currentStatus}" aria-label="Application status for ${app.full_name}" onchange="updateApplicationStatus('${safeId}', this)">
                                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Reviewed" ${currentStatus === 'Reviewed' ? 'selected' : ''}>Reviewed</option>
                                <option value="Interview" ${currentStatus === 'Interview' ? 'selected' : ''}>Interview</option>
                                <option value="Rejected" ${currentStatus === 'Rejected' ? 'selected' : ''}>Rejected</option>
                                <option value="Hired" ${currentStatus === 'Hired' ? 'selected' : ''}>Hired</option>
                            </select>
                        </td>
                        <td><a href="${app.resume_link}" target="_blank" rel="noopener noreferrer">View</a></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loading-msg').innerText = 'Error loading data. Is server running?';
                document.getElementById('loading-msg').style.color = 'red';
            }
        }

        document.addEventListener('DOMContentLoaded', loadApplications);
    </script>
</body>
</html>
