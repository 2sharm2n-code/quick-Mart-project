<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply - QuickMart Kenya</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container"><h1>QuickMart Kenya Careers</h1><a href="index.html" class="back-link">← Back to Jobs</a></div></header><main class="container"><div class="form-container"><h2 id="job-title">Apply for Position</h2><p class="muted">Complete your details carefully. If shortlisted, you will continue through the same application link.</p><form id="application-form"><input type="hidden" id="job-id"><label for="full_name">Full Name</label><input type="text" id="full_name" required autocomplete="name"><label for="email">Email Address</label><input type="email" id="email" required autocomplete="email"><label for="phone">Kenya Phone Number</label><input type="tel" id="phone" required placeholder="0712345678" autocomplete="tel"><label for="county">Home County</label><input type="text" id="county" required placeholder="Nairobi"><label for="qualification">Highest Qualification</label><input type="text" id="qualification" required placeholder="Diploma / Degree / Certificate"><label for="experience">Relevant Experience</label><textarea id="experience" rows="4" required placeholder="Briefly describe relevant experience"></textarea><label for="motivation">Why do you want to work with QuickMart?</label><textarea id="motivation" rows="4" required></textarea><label for="resume_link">Resume/CV Link (optional)</label><input type="url" id="resume_link" placeholder="https://..."><label for="cover_letter">Cover Letter (optional)</label><textarea id="cover_letter" rows="5"></textarea><button type="submit">Submit Application</button></form><div id="message"></div></div></main><script src="script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search),id=p.get('id'),title=p.get('title');if(id){document.getElementById('job-id').value=id;document.getElementById('job-title').textContent='Apply for: '+(title||'QuickMart Position')}else{document.getElementById('job-title').textContent='Select a Job First';document.querySelector('form').style.display='none'}});</script></body></html>
