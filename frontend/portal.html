<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickMart Applicant Portal</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f6f8fb}.portal{max-width:760px;margin:40px auto;padding:24px}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}.muted{color:#64748b}.question{margin:18px 0}.question label{display:block;font-weight:700;margin-bottom:8px}.question textarea,.question input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.primary{background:#0f62fe;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.cost{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e2e8f0}.total{font-size:1.25rem;font-weight:800;margin-top:18px}.notice{padding:14px;border-radius:10px;background:#eef6ff;margin:16px 0}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.hidden{display:none}
</style>
</head>
<body>
<main class="portal"><div class="card" id="portal-root"><p class="muted">Loading your application...</p></div></main>
<script src="portal.js"></script>
</body>
</html>
