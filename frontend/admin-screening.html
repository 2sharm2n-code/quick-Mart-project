<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickMart HR — Screening Queue</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f4f5;font-family:Inter,system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:22px}.badge{background:#b91c1c;color:#fff;border-radius:999px;padding:7px 12px;font-weight:800}.sub{color:#a1a1aa}.card{background:#12161b;border:1px solid #272b32;border-radius:16px;margin-top:18px;overflow:hidden}.row{padding:18px;border-bottom:1px solid #272b32}.row:last-child{border-bottom:0}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.name{font-weight:800;font-size:18px}.meta{color:#a1a1aa;font-size:14px;margin-top:5px}.answers{display:grid;gap:12px;margin:16px 0}.answer{background:#0d1014;border:1px solid #242932;border-radius:10px;padding:12px}.q{font-size:12px;text-transform:uppercase;color:#9ca3af;margin-bottom:6px}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,textarea{background:#0b0d10;border:1px solid #303640;color:#fff;border-radius:9px;padding:10px}textarea{width:100%;min-height:70px}.score{width:100px}button{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.pass{background:#166534;color:#fff}.fail{background:#991b1b;color:#fff}.save{background:#e5e7eb;color:#111}.empty{padding:30px;text-align:center;color:#a1a1aa}.error{color:#fca5a5;padding:15px}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">QuickMart Kenya — HR Screening</div><div class="sub">New applicants awaiting screening review</div></div><div id="count" class="badge">0 NEW</div></div><div id="error"></div><section id="queue" class="card"><div class="empty">Loading screening queue…</div></section></main><script>
const $=s=>document.querySelector(s);let rows=[];
async function load(){try{const r=await fetch('/api/applications');if(!r.ok)throw new Error('Could not load applicants');const all=await r.json();rows=all.filter(a=>['Applied','Screening'].includes(a.current_stage)&&(!a.screening_decision||a.screening_decision==='Pending'));$('#count').textContent=`${rows.length} NEW`;render()}catch(e){$('#error').innerHTML=`<div class="error">${e.message}</div>`}}
function render(){if(!rows.length){$('#queue').innerHTML='<div class="empty">No applicants are waiting for screening.</div>';return}$('#queue').innerHTML=rows.map((a,i)=>`<article class="row"><div class="head"><div><div class="name">${esc(a.full_name)}</div><div class="meta">${esc(a.email||'')} · ${esc(a.phone||'No phone')} · ${esc(a.job_title||'')} · Code: <b>${esc(a.lookup_code)}</b></div></div><span class="badge">NEW</span></div><div class="answers"><div class="answer"><div class="q">Qualification</div>${esc(a.qualification||'Not provided')}</div><div class="answer"><div class="q">Experience</div>${esc(a.experience||'Not provided')}</div><div class="answer"><div class="q">Motivation</div>${esc(a.motivation||'Not provided')}</div></div><div class="controls"><input id="score-${i}" class="score" type="number" min="0" max="100" placeholder="Score"><button class="pass" onclick="decide(${i},'Pass')">PASS → INTERVIEW</button><button class="fail" onclick="decide(${i},'Fail')">FAIL → REJECTED</button><button class="save" onclick="decide(${i},'Pending')">SAVE REVIEW</button></div><textarea id="notes-${i}" placeholder="HR screening notes"></textarea></article>`).join('')}
async function decide(i,decision){const a=rows[i],score=$(`#score-${i}`).value,notes=$(`#notes-${i}`).value;try{const r=await fetch(`/api/applications/${a.id}/screening`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,score:score===''?null:Number(score),notes})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Screening update failed');await load()}catch(e){$('#error').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,15000);
</script></body></html>
