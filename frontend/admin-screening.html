<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickMart Kenya — HR Screening</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0b0d10;color:#f4f4f5}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:24px;font-weight:800}.sub{color:#9ca3af}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#15181d;border:1px solid #292d34;border-radius:12px;padding:14px 18px;min-width:145px}.stat b{display:block;font-size:25px;margin-top:3px}.card{background:#12151a;border:1px solid #292d34;border-radius:14px;padding:16px;margin-top:12px}.name{font-weight:800;font-size:18px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.meta{color:#9ca3af;font-size:14px;margin-top:5px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#242830;color:#d1d5db;font-size:12px}.new{background:#7f1d1d;color:#fff}.answers{margin-top:14px;padding:12px;background:#0e1115;border-radius:10px;display:none}.answers.open{display:block}.answer{margin:10px 0}.answer strong{display:block;color:#d1d5db;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid #343943;background:#20242b;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:800}.pass{background:#14532d}.fail{background:#7f1d1d}.send{background:#242830}.empty{text-align:center;color:#9ca3af;padding:30px}.error{color:#fca5a5;padding:12px}.toast{position:fixed;right:16px;bottom:16px;background:#171a20;border:1px solid #343943;padding:12px 15px;border-radius:10px;display:none}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="brand">QuickMart Kenya — HR Screening</div><div class="sub">Review applicants before interview. Decisions update the applicant's same-link portal.</div></div><button onclick="load()">Refresh queue</button></div>
<div class="stats"><div class="stat"><span class="sub">New screening</span><b id="newCount">0</b></div><div class="stat"><span class="sub">Awaiting review</span><b id="reviewCount">0</b></div><div class="stat"><span class="sub">Passed</span><b id="passCount">0</b></div><div class="stat"><span class="sub">Rejected</span><b id="failCount">0</b></div></div>
<div id="error"></div><section id="queue"><div class="empty card">Loading screening queue…</div></section></main><div id="toast" class="toast"></div>
<script>
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};let rows=[];
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function answersFor(r){if(r.screening_answers&&typeof r.screening_answers==='object')return r.screening_answers;try{const x=JSON.parse(r.screening_notes||'{}');return x&&typeof x==='object'?x:{}}catch{return {}}}
function render(){const review=rows.filter(r=>['Applied','Screening'].includes(r.current_stage)&&(!r.screening_decision||r.screening_decision==='Pending'));const fresh=review.filter(r=>new Date(r.applied_date)>new Date(Date.now()-86400000));document.getElementById('newCount').textContent=fresh.length;document.getElementById('reviewCount').textContent=review.length;document.getElementById('passCount').textContent=rows.filter(r=>r.screening_decision==='Pass').length;document.getElementById('failCount').textContent=rows.filter(r=>r.screening_decision==='Fail'||r.current_stage==='Rejected').length;const q=document.getElementById('queue');if(!review.length){q.innerHTML='<div class="empty card">No applicants are waiting for screening review.</div>';return}q.innerHTML=review.map((r,i)=>{const a=answersFor(r);return `<article class="card"><div class="row"><div><div class="name">${esc(r.full_name)}</div><div class="meta">${esc(r.email)} · ${esc(r.phone||'No phone')} · ${esc(r.county||'County not provided')}</div></div><div><span class="pill new">NEW</span> <span class="pill">${esc(r.lookup_code)}</span></div></div><div class="meta">${esc(r.job_title||'QuickMart role')} · Qualification: ${esc(r.qualification||'Not provided')} · Applied ${new Date(r.applied_date).toLocaleString()}</div><div id="ans-${i}" class="answers">${Object.keys(a).length?Object.entries(a).map(([k,v])=>`<div class="answer"><strong>${esc(k.replace(/[_-]/g,' '))}</strong><span>${esc(v)}</span></div>`).join(''):'<span class="sub">No portal screening answers submitted yet.</span>'}</div><div class="actions"><button onclick="toggle(${i})">View screening answers</button><button class="pass" onclick="decide(${r.id},'Pass')">PASS → INTERVIEW</button><button class="fail" onclick="decide(${r.id},'Fail')">FAIL → REJECTED</button><button class="send" onclick="message(${r.id},${i})">Send applicant message</button></div></article>`}).join('')}
function toggle(i){document.getElementById('ans-'+i).classList.toggle('open')}
async function load(){try{const r=await fetch('/api/applications');const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load applications');rows=d;render()}catch(e){document.getElementById('error').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function decide(id,decision){const notes=decision==='Pass'?'Screening approved by HR — applicant may proceed to interview.':'Screening not approved by HR — applicant will not proceed to interview.';const r=await fetch(`/api/applications/${id}/screening`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,notes})});const d=await r.json();if(!r.ok){toast(d.error||'Decision failed');return}toast(decision==='Pass'?'Applicant moved to Interview.':'Applicant marked Rejected.');await load()}
async function message(id,i){const body=prompt('Message to applicant:','Your screening has been reviewed. Please keep checking your email for the next instructions.');if(!body)return;const r=await fetch('/api/send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:id,subject:'QuickMart Kenya recruitment update',body})});const d=await r.json();toast(r.ok?'Applicant message recorded/sent.':(d.error||'Message failed'))}
load();setInterval(load,15000);
</script></body></html>
