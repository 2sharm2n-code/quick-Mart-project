<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickMart HR Workflow</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f4f5;font-family:Inter,system-ui,Arial}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900}.muted{color:#9ca3af}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:#11151a;border:1px solid #272d35;border-radius:15px}.card{padding:16px}.num{font-size:28px;font-weight:900;margin-top:4px}.panel{overflow:hidden}.row{padding:15px;border-bottom:1px solid #242932}.row:last-child{border:0}.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.name{font-weight:800}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#20262e;color:#d1d5db;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select,input,textarea{font:inherit;border-radius:9px;padding:9px;border:1px solid #303640;background:#0b0e12;color:#fff}button{cursor:pointer;font-weight:800}.pass{background:#166534}.fail{background:#991b1b}.save{background:#374151}.answer{margin-top:8px;padding:10px;background:#0c1014;border-radius:9px}.q{font-size:11px;text-transform:uppercase;color:#9ca3af}.error{color:#fca5a5;margin:10px 0}.success{color:#86efac}@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">QuickMart Kenya — HR Workflow</div><div class="muted">Screening, interview, onboarding and payment pipeline</div></div><select id="stage"><option value="">All stages</option><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Hired</option><option>Onboarding</option><option>Completed</option><option>Rejected</option></select></div><section class="cards"><div class="card"><div class="muted">Applications</div><div id="total" class="num">—</div></div><div class="card"><div class="muted">Screening</div><div id="screening" class="num">—</div></div><div class="card"><div class="muted">Interviews today</div><div id="today" class="num">—</div></div><div class="card"><div class="muted">Pending payments</div><div id="pending" class="num">—</div></div></section><div id="error"></div><section id="list" class="panel"><div class="row muted">Loading…</div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function stats(){const r=await fetch('/api/dashboard/stats');if(!r.ok)throw Error('Dashboard unavailable');const x=await r.json();$('#total').textContent=x.total_applications;$('#today').textContent=x.interviews_today;$('#pending').textContent=x.pending_payments?.pending_payments??0;$('#screening').textContent=(x.by_stage||[]).find(x=>x.current_stage==='Screening')?.count||0}async function load(){try{await stats();const s=$('#stage').value;const url=s?'/api/dashboard/queue?stage='+encodeURIComponent(s):'/api/dashboard/queue';const r=await fetch(url);if(!r.ok)throw Error('Queue unavailable');const rows=await r.json();$('#list').innerHTML=rows.length?rows.map(a=>`<article class="row"><div class="rowtop"><div><div class="name">${esc(a.full_name)}</div><div class="muted">${esc(a.email)} · ${esc(a.phone||'No phone')} · ${esc(a.job_title)} · ${esc(a.lookup_code)}</div></div><span class="tag">${esc(a.current_stage)}</span></div><div class="actions"><button onclick="viewProgress(${a.id})">VIEW PROGRESS</button>${a.current_stage==='Screening'||a.current_stage==='Applied'?`<button class="pass" onclick="screen(${a.id},'Pass')">PASS → INTERVIEW</button><button class="fail" onclick="screen(${a.id},'Fail')">FAIL → REJECTED</button>`:''}</div></article>`).join(''):'<div class="row muted">No applications in this queue.</div>'}catch(e){$('#error').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function screen(id,d){const score=prompt('Screening score (0–100):');if(score===null)return;const notes=prompt('HR screening notes:')||'';const r=await fetch('/api/applications/'+id+'/screening',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:d,score:Number(score),notes})});if(!r.ok){const x=await r.json();alert(x.error||'Update failed');return}load()}async function viewProgress(id){const r=await fetch('/api/applications/'+id+'/progress');const x=await r.json();alert(x.map(e=>`${e.timestamp} — ${e.type} — ${e.stage} — ${e.status||''}`).join('\n')||'No progress events')}$('#stage').onchange=load;load();setInterval(load,15000);</script></body></html>
