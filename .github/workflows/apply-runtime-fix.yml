name: Apply runtime fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Express stage actor wiring and final runtime routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text()
          old="app.patch('/api/applications/:id/stage',handleStageUpdate);"
          new="app.patch('/api/applications/:id/stage',(req,res)=>handleStageUpdate(req,res,'HR'));"
          if old in s:
              s=s.replace(old,new,1)

          if "app.post('/api/applications/:id/presence'" not in s:
              routes=r'''\n// Final runtime hardening: applicant presence, identity verification, CV metadata, and communications.\napp.post('/api/applications/:id/presence',async(req,res)=>{try{const id=Number(req.params.id);if(!Number.isInteger(id)||id<1)return res.status(400).json({error:'Invalid application id'});const a=await pool.query('SELECT id,current_stage FROM applications WHERE id=$1',[id]);if(!a.rows.length)return res.status(404).json({error:'Application not found'});const token=String(req.body?.session_token||'').slice(0,120)||null;const ua=String(req.get('user-agent')||'').slice(0,500);await pool.query(`INSERT INTO applicant_presence(application_id,current_stage,last_seen_at,session_token,user_agent) VALUES($1,$2,NOW(),$3,$4) ON CONFLICT(application_id) DO UPDATE SET current_stage=EXCLUDED.current_stage,last_seen_at=NOW(),session_token=EXCLUDED.session_token,user_agent=EXCLUDED.user_agent`,[id,a.rows[0].current_stage,token,ua]);await pool.query('UPDATE applications SET last_seen_at=NOW(),last_seen_stage=$1 WHERE id=$2',[a.rows[0].current_stage,id]);res.json({ok:true,current_stage:a.rows[0].current_stage});}catch(e){console.error(e);res.status(500).json({error:'Presence update failed'});}});\napp.get('/api/dashboard/online',async(req,res)=>{try{const minutes=Math.min(15,Math.max(1,Number(req.query.minutes)||5));const r=await pool.query(`SELECT a.id,a.lookup_code,c.full_name,c.email,c.phone,a.current_stage,p.last_seen_at FROM applicant_presence p JOIN applications a ON a.id=p.application_id JOIN candidates c ON c.id=a.candidate_id WHERE p.last_seen_at>=NOW()-($1::int*INTERVAL '1 minute') ORDER BY p.last_seen_at DESC`,[minutes]);res.json(r.rows);}catch(e){console.error(e);res.status(500).json({error:'Online applicant lookup failed'});}});\napp.patch('/api/candidates/:id/verify',async(req,res)=>{try{const id=Number(req.params.id);const verified=Boolean(req.body?.verified);const notes=String(req.body?.notes||'').slice(0,5000);const r=await pool.query('UPDATE candidates SET identity_verified=$1,verification_notes=$2 WHERE id=$3 RETURNING id,full_name,email,identity_verified,verification_notes',[verified,notes,id]);if(!r.rows.length)return res.status(404).json({error:'Candidate not found'});res.json(r.rows[0]);}catch(e){console.error(e);res.status(500).json({error:'Identity verification failed'});}});\napp.post('/api/applications/:id/cv',async(req,res)=>{try{const id=Number(req.params.id),filename=String(req.body?.filename||'').trim(),mime=String(req.body?.mime_type||'application/octet-stream').slice(0,100),data=String(req.body?.data_base64||'');if(!Number.isInteger(id)||id<1||!filename||!data)return res.status(400).json({error:'application id, filename and data_base64 are required'});if(data.length>3000000)return res.status(413).json({error:'CV file is too large for this portal'});const a=await pool.query('SELECT candidate_id FROM applications WHERE id=$1',[id]);if(!a.rows.length)return res.status(404).json({error:'Application not found'});const r=await pool.query('UPDATE candidates SET cv_file_data=$1,cv_mime_type=$2,cv_original_name=$3,cv_file_path=$3 WHERE id=$4 RETURNING id,cv_original_name,cv_mime_type',[data,mime,filename,a.rows[0].candidate_id]);res.status(201).json({ok:true,candidate:r.rows[0]});}catch(e){console.error(e);res.status(500).json({error:'CV upload failed'});}});\napp.post('/api/communications/send',async(req,res)=>{try{const id=Number(req.body?.application_id),channel=String(req.body?.channel||'Email'),subject=String(req.body?.subject||'QuickMart Kenya update'),body=String(req.body?.body||'');if(!Number.isInteger(id)||id<1||!body)return res.status(400).json({error:'application_id and body are required'});const a=await pool.query('SELECT c.email,c.full_name,a.lookup_code FROM applications a JOIN candidates c ON c.id=a.candidate_id WHERE a.id=$1',[id]);if(!a.rows.length)return res.status(404).json({error:'Application not found'});const x=a.rows[0],recipient=String(req.body?.recipient||x.email),rendered=body.replace(/\\{\\{full_name\\}\\}/g,x.full_name).replace(/\\{\\{lookup_code\\}\\}/g,x.lookup_code);res.json(await sendCommunication(id,channel,subject,rendered,recipient));}catch(e){console.error(e);res.status(500).json({error:'Communication failed'});}});\n'''
              marker='app.listen('
              if marker not in s: raise SystemExit('app.listen not found')
              s=s.replace(marker,routes+'\n'+marker,1)
          p.write_text(s)
          PY
          node --check backend/server.js
          git config user.name 'quickmart-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.js
          if ! git diff --cached --quiet; then
            git commit -m 'Wire applicant presence and HR hardening routes'
            git push origin main
          fi
