# QuickMart CI - validates the current main branch after every push.
name: QuickMart Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quick_mart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quick_mart_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USER: postgres
      DB_HOST: localhost
      DB_NAME: quick_mart_db
      DB_PASSWORD: postgres
      DB_PORT: 5432
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check server
        run: node --check backend/server.js

      - name: Syntax check frontend script
        run: node --check frontend/script.js

      - name: Start server
        run: node backend/server.js > server.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/jobs >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready. Log follows:"
          test -f server.log && cat server.log || true
          exit 1

      - name: Smoke test jobs and applications
        run: |
          curl -fsS http://127.0.0.1:3000/api/jobs
          curl -fsS http://127.0.0.1:3000/api/jobs/1
          curl -fsS http://127.0.0.1:3000/api/applications

      - name: Test application creation and lookup
        run: |
          RESPONSE=$(curl -fsS -X POST http://127.0.0.1:3000/api/apply \
            -H 'Content-Type: application/json' \
            -d '{"job_id":1,"full_name":"CI Test Candidate","email":"ci-test@example.com","phone":"0712345678","resume_link":"","cover_letter":"CI smoke test"}')
          echo "$RESPONSE"
          CODE=$(RESPONSE_JSON="$RESPONSE" node -e "const x=JSON.parse(process.env.RESPONSE_JSON); if(!x.data?.lookup_code) process.exit(1); process.stdout.write(x.data.lookup_code)")
          echo "Lookup code: $CODE"
          LOOKUP=$(curl -fsS "http://127.0.0.1:3000/api/lookup/$CODE")
          echo "$LOOKUP"
          LOOKUP_JSON="$LOOKUP" node -e "const x=JSON.parse(process.env.LOOKUP_JSON); if(x.current_stage !== 'Applied' || !x.full_name) process.exit(1)"

      - name: Test stage update
        run: |
          ID=$(curl -fsS http://127.0.0.1:3000/api/applications | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x[0]?.id)process.exit(1);process.stdout.write(String(x[0].id));})")
          RESPONSE=$(curl -fsS -X PATCH "http://127.0.0.1:3000/api/applications/$ID/stage" \
            -H 'Content-Type: application/json' \
            -d '{"stage":"Screening"}')
          echo "$RESPONSE"
          STAGE_JSON="$RESPONSE" node -e "const x=JSON.parse(process.env.STAGE_JSON); if(x.current_stage !== 'Screening') process.exit(1)"

      - name: Show server log on failure
        if: failure()
        run: test -f server.log && cat server.log || true
